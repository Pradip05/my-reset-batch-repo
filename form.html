<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore form</title>
    <style>
        label{
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        
    </header>
    <main>
        <section>
            <h2>Pls fill up the form</h2>
            <form>
                <label for="name">Your name :
                    <input id="name" type="text" placeholder="Your Name">
                </label>
                <label for="e-mail">Your e-mail:
                    <input type="text" id="e-mail" placeholder="Your e-mail">
                </label>
                <label for="Mobile number">Mobile number:
                    <input type="text" id="mobile number" placeholder="Mobile number">
                </label>
                <fieldset>
                    <legend>Pick one option</legend>
                    <label for="name">
                        <input type="radio" name="option" id="name">name
                    </label>
                    <label for="e-mail">
                        <input type="radio" name="option" id="e-mail">e-mail
                    </label>
                </fieldset>
                <fieldset>
                    <legend>Pick one or more vorta</legend>
                    <label for="alu"><input type="checkbox" name="vorta" id="alu">alu</label>
                    <label for="dim"><input type="checkbox" name="vorta" id="dim">dim</label>
                    <label for="begun"><input type="checkbox" name="vorta" id="begun"></label>

                </fieldset>
                <fieldset>
                    <legend>
                        special instruction
                    </legend>
                    <textarea name="" id="" cols="30" rows="10"></textarea>
                </fieldset>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </form>
        </section>

    </main>
    <footer>

    </footer>
</body>
</html>
